name: PHP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sodium, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: make test
      - name: Run PHPStan
        if: matrix.php == '8.2'
        run: make phpstan
