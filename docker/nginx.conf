server {
    listen 80;
    server_name _;
    root /app/public;
    client_max_body_size 64k;
    # OAuth callback queries and Authorization headers must not enter access logs.
    access_log off;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~ ^/(src|vendor|var|bin|migrations)/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /media {
        client_max_body_size 65m;
        include /etc/nginx/app-fastcgi.conf;
    }

    location / {
        include /etc/nginx/app-fastcgi.conf;
    }
}
